[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapphire-perps"
version = "0.1.0"
description = "Automated perpetual-futures trading system: risk kernel + signal layer + multi-venue execution (Hyperliquid, Lighter, Robinhood). Paper-first, fail-closed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "arigatoexpress" }]
keywords = ["trading", "perpetuals", "hyperliquid", "lighter", "robinhood", "defi"]

# Core runtime is intentionally light. PyYAML is only needed to read YAML
# config; the system runs on defaults (or JSON config) without it.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hyperliquid = ["hyperliquid-python-sdk>=0.9", "eth-account>=0.10"]
lighter = ["lighter-sdk>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
sapphire-perps = "sapphire_perps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: line length handled by formatter. UP042: we keep explicit `str, Enum`
# rather than StrEnum to preserve repr/str semantics across the codebase.
ignore = ["E501", "UP042"]
